services:
  postgres:
    image: postgres:16
    container_name: sleepmind_postgres
    environment:
      POSTGRES_DB: sleepmind
      POSTGRES_USER: sleepmind_user
      POSTGRES_PASSWORD: sleepmind_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
